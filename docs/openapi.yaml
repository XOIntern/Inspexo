openapi: 3.0.3
info:
  title: InspeXO Auth & Admin API
  version: 1.11.0
  description: |
    Backend authentication, authorization, verification, and admin
    management for InspeXO. This document is generated by hand and kept
    honest by `tests/auth/openapi.contract.test.ts`, which asserts every
    route file has a matching entry here and vice versa.

    ## UI integration notes (read first)

    * There is NO public registration. No `/register` endpoint exists and
      none is documented here. Users are provisioned by ADMIN only.
    * The login page (`/auth/login`) currently offers Microsoft SSO only
      (Entra is not wired). There is NO email/password form and NO
      forgot-password screen yet. The `POST /api/auth/*` contract below
      stands alone; the reset/verify links target future pages at
      `/auth/reset-password?token=…` and `/auth/verify-email?token=…`,
      which do not exist yet.
    * The Admin Dashboard UI does not exist yet. It must consume
      `/api/admin/*` over HTTP and must never import the DAL/database.

    ## Authentication model

    * Sessions are PASETO v3.local tokens (`sub: userId`, `jti`, 8 h
      expiry) carried ONLY in the `__Host-inspexo_session` cookie
      (`HttpOnly`, `Secure`, `SameSite=Lax`, `Path=/`). Never
      localStorage. The token carries identity only — role, department,
      and site assignments are re-read from the database per request.
    * Every request is validated twice: cryptographic expiry in the
      token, then the `Session` row (`revokedAt IS NULL AND
      expiresAt > now()`). Logout revokes the row and clears the cookie.
    * `401` = "I cannot identify you" (one generic message per endpoint).
      `403` = "I know exactly who you are, and no" (specific codes are
      safe post-authentication).

    ## Roles and site scope

    * Roles: `admin` (system administration only — inherits ZERO HSE
      permissions), `verificator` (multi-site), `auditor` (multi-site),
      `auditee` (exactly one site). Single-admin system: the API never
      assigns `admin`.
    * Site scope comes ONLY from `UserSite` rows. A role alone never
      grants any site. `requireSiteAccess` is one existence check.
    * Permissions are derived from roles in code (`permissions.ts`).
      Minimal set: `user.manage`, `site.assign` (admin);
      `verification.review`, `verification.verifyClosure`;
      `audit.schedule`, `audit.conduct`, `finding.record`;
      `inspection.daily`, `inspection.checklist`, `capa.implement`.

    ## Anti-abuse

    Login: 5 failures / 15 min per email+network (429), reset on success.
    Verification resend: 3 / 15 min per user. Password-reset request:
    5 / 15 min per email (always 202, even throttled). Anonymous
    verification: 100 / 15 min per network. Bulk endpoints: 20 / hour
    per admin. Login and verification run dummy Argon2id verifies so
    response timing never reveals account existence.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: auth
    description: Login, sessions, passwords, verification
  - name: admin
    description: Admin-only user and site management
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      description: |
        Creates a PASETO session for an admin-provisioned account.
        Unknown email, wrong password, expired temporary credential,
        and inactive/suspended status ALL return the identical 401 —
        the response never reveals which failed. Unverified emails are
        NOT blocked: success returns `emailVerified: false` and the
        dashboard shows a verification notice. A failed login clears
        any session cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
            example:
              email: sari.wulandari@inspexo.id
              password: correct-horse-12
      responses:
        '200':
          description: Authenticated; session cookie set
          headers:
            Set-Cookie:
              description: __Host-inspexo_session (HttpOnly, Secure, SameSite=Lax, Path=/, 8 h)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user, emailVerified, mustChangePassword]
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
                  emailVerified:
                    type: boolean
                  mustChangePassword:
                    type: boolean
              example:
                user:
                  id: 0194aaaa-aaaa-7aaa-8aaa-000000000003
                  name: Sari Wulandari
                  email: sari.wulandari@inspexo.id
                  role: auditee
                  status: active
                  department: null
                  siteIds: [0194bbbb-bbbb-7bbb-8bbb-000000000001]
                emailVerified: false
                mustChangePassword: true
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      description: |
        Idempotent — always 204, with or without a cookie. Revocation
        kills the session everywhere (all browsers/devices); clearing
        the cookie affects only this browser.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '204':
          description: Logged out; session revoked and cookie cleared
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Rotate the caller's own password
      description: |
        Requires a valid session. Verifies the current secret, enforces
        the 12–1024 policy, rejects reuse of the current secret, clears
        `mustChangePassword`, and revokes every OTHER session (a rotation
        is exactly when stale sessions must die; the calling session is
        spared so the user is not logged out mid-flow).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 1024
      responses:
        '200':
          description: Password rotated
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '401':
          description: No/invalid session, or wrong current password (same message; caller is authenticated so specificity is safe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user (canonical)
      description: |
        Safe-shape user for the frontend: identity, role, verification
        flags, and site assignments. Never contains password hashes,
        tokens, or verification secrets (asserted by exact key-set
        tests). The dashboard reads `emailVerified` here to decide on
        the verification notice.
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/AccountDisabled'
  /api/auth/session:
    get:
      tags: [auth]
      summary: Current authenticated user (legacy alias of /me)
      description: Identical to `GET /api/auth/me` by construction — both delegate to one response builder.
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/AccountDisabled'
  /api/auth/verify-email:
    post:
      tags: [auth]
      summary: Redeem an email-verification token
      description: |
        Anonymous by design — no session required, so links work in any
        browser/device. The token binds its own userId and can only ever
        verify that one account; it can never authenticate as anyone.
        Unknown, expired, and already-used tokens collapse to one
        generic 400. Verification and PASETO sessions are fully
        separate mechanisms.
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Raw 43-char token from the emailed link (never stored server-side)
      responses:
        '200':
          description: Email verified (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified:
                    type: boolean
                    example: true
        '400':
          description: Invalid, expired, or already-used token (generic message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: Invalid or expired verification link.
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          description: Per-network blind-attempt budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/resend-verification:
    post:
      tags: [auth]
      summary: Reissue the caller's own verification link
      description: |
        Requires a session and resends ONLY for the caller's own
        account (anonymous resend-by-email would be an enumeration
        oracle). Invalidates all live tokens first, then issues exactly
        one new 24 h token via Resend. Already-verified callers get
        success without issuing or sending. Throttled: 3 per 15 min.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Link sent, or already verified
          content:
            application/json:
              schema:
                type: object
                required: [verified, sent]
                properties:
                  verified:
                    type: boolean
                  sent:
                    type: boolean
              examples:
                sent:
                  value: { verified: false, sent: true }
                already-verified:
                  value: { verified: true, sent: false }
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Mail transport failure (generic; no provider details leak)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset link
      description: |
        ALWAYS returns 202 with `{sent: true}` — existent or not,
        active or not, throttled or not, malformed or not. Tokens are
        issued only for existing active users (opaque random, SHA-256
        hash stored, 1 h expiry, single-use, previous tokens
        superseded) and emailed via Resend. Throttled per email
        (5 / 15 min) without changing the status.
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '202':
          description: Accepted (always, regardless of outcome)
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent:
                    type: boolean
                    example: true
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: Redeem a reset token with a new password
      description: |
        Anonymous like verification. Enforces the 12–1024 policy, then
        atomically: marks the token used, stores the Argon2id hash,
        clears `mustChangePassword` (self-chosen secret), stamps the
        credential time, and revokes EVERY session — no session is
        trusted after a reset. Reuse/expiry/garbage collapse to one
        generic 400. Responses never contain secrets.
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 1024
      responses:
        '200':
          description: Password reset; all sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [reset]
                properties:
                  reset:
                    type: boolean
                    example: true
        '400':
          description: Invalid, expired, or already-used token (generic message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: Invalid or expired reset link.
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/admin/users:
    get:
      tags: [admin]
      summary: List users with search, filters, and pagination
      description: |
        Admin role required. `search` matches name or email
        case-insensitively (`%`/`_` escaped). `siteId` filters by
        assignment. Page starts at 1 (default), pageSize defaults to
        20 and caps at 100. Shapes are secret-free.
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string, enum: [admin, verificator, auditor, auditee] }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, suspended] }
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                required: [users, total, page, pageSize]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserView'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          description: Invalid role/status/siteId filter or pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: Provision one user (temporary credential returned once)
      description: |
        Admin role required. Creates an unverified account with an
        Argon2id-hashed system-generated temporary password, returned
        ONCE in the response for out-of-band relay — never stored,
        never logged, never retrievable again. `admin` is not an
        assignable role. Site cardinality enforced per role (auditee:
        exactly 1; others: ≥ 1).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                role:
                  type: string
                  enum: [verificator, auditor, auditee]
                siteIds:
                  type: array
                  items: { type: string, format: uuid }
                status:
                  type: string
                  enum: [active, inactive, suspended]
                  default: active
                department:
                  type: string
                  maxLength: 128
            example:
              name: Sari Wulandari
              email: sari.wulandari@inspexo.id
              role: auditee
              siteIds: [0194bbbb-bbbb-7bbb-8bbb-000000000001]
      responses:
        '201':
          description: User provisioned
          content:
            application/json:
              schema:
                type: object
                required: [user, tempPassword]
                properties:
                  user:
                    $ref: '#/components/schemas/ProvisionedUser'
                  tempPassword:
                    type: string
                    description: 20-char secret, present only in this response
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '409':
          description: Email already registered (admin audience only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid input, unassignable role, unknown site, or cardinality violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/import:
    post:
      tags: [admin]
      summary: Bulk-create users without credentials (Excel import)
      description: |
        Admin role required. The UI parses Excel client-side and sends
        JSON rows (max 200). Every row gets full single-provision
        validation; rows are independent — one bad row never fails the
        rest. Accounts are created WITHOUT credentials (`passwordHash`
        null); distribute later via the credentials endpoint. A
        per-admin hourly budget applies (20 calls/hour → 429).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
      responses:
        '200':
          description: Per-row envelope (no secrets)
          content:
            application/json:
              schema:
                type: object
                required: [created, failed]
                properties:
                  created:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProvisionedUser'
                  failed:
                    type: array
                    items:
                      type: object
                      required: [index, email, code]
                      properties:
                        index:
                          type: integer
                        email:
                          type: string
                          nullable: true
                        code:
                          type: string
                          example: DUPLICATE_EMAIL
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          description: Payload is not a 1–200 row array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/credentials:
    post:
      tags: [admin]
      summary: Generate temporary credentials for many users at once
      description: |
        Admin role required. Each account must exist and be active;
        others land in `failed`. Secrets appear ONLY in this response —
        the batch response IS the export the admin saves. Afterwards the
        plaintext exists nowhere. Re-distribution means fresh
        credentials (overwriting the hash kills the old ones). A
        per-admin hourly budget applies (20 calls/hour → 429).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Batch credential envelope (secrets, once only)
          content:
            application/json:
              schema:
                type: object
                required: [credentials, failed]
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      required: [userId, email, tempPassword]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                        tempPassword:
                          type: string
                  failed:
                    type: array
                    items:
                      type: object
                      required: [userId, code]
                      properties:
                        userId:
                          type: string
                        code:
                          type: string
                          example: USER_NOT_FOUND
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          description: userIds is not a 1–200 UUID array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}:
    get:
      tags: [admin]
      summary: View user details
      description: Identity, role, status, verification flags, and site objects. Secret-free.
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUserDetail'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Malformed user id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}/contact:
    patch:
      tags: [admin]
      summary: Change a user's name and/or email
      description: |
        An email change resets verification (`emailVerifiedAt` → null)
        and kills live verification tokens in the same transaction —
        otherwise a new, unverified address would inherit the old
        address's verified state. Duplicate emails rejected.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                type: object
                required: [id, name, email, emailVerified]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  emailVerified:
                    type: boolean
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid contact data, duplicate email, or malformed id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}/role:
    patch:
      tags: [admin]
      summary: Change a user's role
      description: |
        The user's CURRENT assignments must already satisfy the new
        role's cardinality — otherwise the admin fixes sites first (no
        silent trimming). `admin` is never assignable; the admin cannot
        change their own role (single-admin lockout guard).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [verificator, auditor, auditee]
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required: [id, role]
                properties:
                  id:
                    type: string
                    format: uuid
                  role:
                    type: string
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Unassignable role, cardinality violation, self-change, or malformed id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}/sites:
    put:
      tags: [admin]
      summary: Replace a user's site assignments wholesale
      description: |
        Covers assign AND remove atomically (deduplicated first).
        Every id must exist; cardinality follows the user's current
        role. Admin accounts hold zero sites and cannot be given any.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteIds]
              properties:
                siteIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Assignments replaced
          content:
            application/json:
              schema:
                type: object
                required: [id, siteIds]
                properties:
                  id:
                    type: string
                    format: uuid
                  siteIds:
                    type: array
                    items: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Unknown site, cardinality violation, or malformed id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}/status:
    patch:
      tags: [admin]
      summary: Activate or deactivate a user
      description: |
        Deactivation revokes all of the user's sessions in the same
        transaction — access ends immediately. The admin cannot
        deactivate their own account (single-admin lockout guard).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended]
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid status, self-deactivation, or malformed id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/sites:
    get:
      tags: [admin]
      summary: List facilities for assignment pickers
      description: Admin role required. Id, stable code, and name — no secrets involved.
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Site list
          content:
            application/json:
              schema:
                type: object
                required: [sites]
                properties:
                  sites:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteView'
              example:
                sites:
                  - id: 0194bbbb-bbbb-7bbb-8bbb-000000000001
                    code: plant-1
                    name: Plant 1
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    OriginHeader:
      name: Origin
      in: header
      description: Must match the request host on mutating calls (CSRF defence in depth alongside SameSite=Lax)
      schema:
        type: string
    SessionCookie:
      name: Cookie
      in: header
      required: true
      description: __Host-inspexo_session PASETO token (HttpOnly, Secure, SameSite=Lax). Absent on anonymous endpoints (login, verify-email, forgot-password, reset-password).
      schema:
        type: string
  schemas:
    SessionUser:
      type: object
      required: [id, name, email, role, status, department, siteIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        department: { type: string, nullable: true }
        siteIds:
          type: array
          items: { type: string, format: uuid }
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/SessionUser'
        - type: object
          required: [emailVerified, mustChangePassword]
          properties:
            emailVerified:
              type: boolean
              description: Proof of mailbox control; zero authority on its own
            mustChangePassword:
              type: boolean
              description: True until the user chooses their own secret
    ProvisionedUser:
      allOf:
        - $ref: '#/components/schemas/SessionUser'
        - type: object
          required: [mustChangePassword]
          properties:
            mustChangePassword:
              type: boolean
    AdminUserView:
      allOf:
        - $ref: '#/components/schemas/SessionUser'
        - type: object
          required: [emailVerified, mustChangePassword, createdAt]
          properties:
            emailVerified:
              type: boolean
            mustChangePassword:
              type: boolean
            createdAt:
              type: string
              format: date-time
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserView'
        - type: object
          required: [sites]
          properties:
            sites:
              type: array
              items:
                $ref: '#/components/schemas/SiteView'
    SiteView:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Generic, safe-to-display message
        code:
          type: string
          description: Stable machine code (e.g. FORBIDDEN_SITE)
          example: FORBIDDEN_SITE
  responses:
    InvalidCredentials:
      description: Unknown email, wrong password, expired temp credential, or inactive account (identical — never reveals which)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Invalid email or password.
    SessionInvalid:
      description: Missing, undecryptable, expired, or revoked session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Authentication required.
    AccountDisabled:
      description: Valid session on a deactivated account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Account is disabled.
    ForbiddenRole:
      description: Authenticated but not an admin
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Insufficient role.
    ForbiddenOrigin:
      description: Mutating request failed the same-origin check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Forbidden.
    InvalidRequest:
      description: Malformed body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Invalid request.
    RateLimited:
      description: Throttle window exhausted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Too many attempts. Try again later.
    InternalError:
      description: Unexpected failure (never leaks internals)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Internal error.
